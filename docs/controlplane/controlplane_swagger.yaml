host: localhost:9000
info:
  contact: {}
  description: Unified API for agents, chat, logs, and files. Authenticate with POST
    /auth/login, then send the token in the Authorization header.
  title: Myaaw Control Plane API
  version: 0.1.0
paths:
  /agents:
    get:
      description: Returns every initialized agent with its default flag, running
        state, port, and base URL.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AgentsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List agents
      tags:
      - Agents
  /agents/{name}:
    delete:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete agent
      tags:
      - Agents
    get:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.AgentInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get agent
      tags:
      - Agents
  /agents/{name}/approvals:
    get:
      description: Effective policy (config.json merged with defaults) plus the runtime
        grants from config/approvals.json. Read-only.
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ApprovalsView'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get approvals
      tags:
      - Approvals
  /agents/{name}/approvals/{id}/decision:
    post:
      consumes:
      - application/json
      description: Forwards the decision to the agent that owns the pending run.
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Approval ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Decision: allow_once | allow_session | allow_always | deny'
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Resolve a tool approval
      tags:
      - Chat
  /agents/{name}/approvals/grants:
    delete:
      description: Empties config/approvals.json. The policy in config.json is untouched.
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OKResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Clear approval grants
      tags:
      - Approvals
  /agents/{name}/approvals/grants/{key}:
    delete:
      description: Removes the key from config/approvals.json (all scopes), or only
        the scopes matching the optional channel/user filters.
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Approval key (tool or tool:action)
        in: path
        name: key
        required: true
        type: string
      - description: Only revoke grants for this channel
        in: query
        name: channel
        type: string
      - description: Only revoke grants for this user id
        in: query
        name: user
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OKResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke an approval grant
      tags:
      - Approvals
  /agents/{name}/approvals/grants/{key}/sessions/{conversation}:
    delete:
      description: Removes only the given conversation from the key's session grants.
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Approval key
        in: path
        name: key
        required: true
        type: string
      - description: Conversation id
        in: path
        name: conversation
        required: true
        type: string
      - description: Restrict to this channel
        in: query
        name: channel
        type: string
      - description: Restrict to this user id
        in: query
