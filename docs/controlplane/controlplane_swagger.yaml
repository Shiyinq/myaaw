basePath: /
definitions:
  api.TimelineItem:
    properties:
      args:
        description: Args carries the full argument JSON of an approval item.
        type: string
      arguments:
        type: string
      attempt:
        description: Retry and compaction details, set on their own kinds.
        type: integer
      dropped_messages:
        type: integer
      id:
        type: string
      is_error:
        type: boolean
      kind:
        type: string
      name:
        type: string
      result:
        type: string
      subagent:
        description: SubAgent names the sub-agent that raised an approval item, if
          any.
        type: string
      text:
        type: string
      tokens_after:
        type: integer
      tokens_before:
        type: integer
    type: object
  backup.Result:
    properties:
      agent:
        type: string
      bytes:
        type: integer
      files:
        type: integer
      path:
        type: string
    type: object
  common.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  config.ApprovalsConfig:
    properties:
      allow:
        description: 'whitelist: never prompts'
        items:
          type: string
        type: array
      deny:
        description: hard refusal
        items:
          type: string
        type: array
      mode:
        description: manual | off
        type: string
      subagents:
        description: inherit | allow | deny
        type: string
      timeout_seconds:
        type: integer
      unattended:
        description: allow | deny
        type: string
    type: object
  config.ComputerUseConfig:
    properties:
      enabled:
        type: boolean
    type: object
  config.CronConfig:
    properties:
      active:
        type: boolean
    type: object
  config.GlobalBotConfig:
    properties:
      blocked_tools:
        items:
          type: string
        type: array
      computer_use:
        $ref: '#/definitions/config.ComputerUseConfig'
      context_max_tokens:
        type: integer
      max_iterations:
        type: integer
      max_tool_output_bytes:
        type: integer
      owner_ids:
        items:
          type: string
        type: array
      queue_workers:
        type: integer
      repeat_tool_call_limit:
        type: integer
      request_retries:
        type: integer
      run_timeout_seconds:
        type: integer
      stream:
        type: boolean
      stream_timeout_seconds:
        type: integer
      tool_timeout_seconds:
        type: integer
      type:
        type: string
      warning_iterations:
        type: integer
      watermark:
        type: boolean
    type: object
  config.HeartbeatConfig:
    properties:
      active:
        type: boolean
      channel:
        type: string
      every:
        type: string
      to:
        type: string
    type: object
  config.ModelPriceConfig:
    properties:
      cache_hit:
        type: number
      input:
        type: number
      off_peak:
        $ref: '#/definitions/config.ModelPriceConfig'
      output:
        type: number
      peak_windows:
        items:
          type: string
        type: array
    type: object
  config.ObservabilityConfig:
    properties:
      enabled:
        type: boolean
      max_content_chars:
        type: integer
      model_prices:
        additionalProperties:
          $ref: '#/definitions/config.ModelPriceConfig'
        type: object
      redact_patterns:
        description: |-
          RedactPatterns masks secrets in stored content. Nil keeps the built-in
          patterns; a pointer to an empty list disables redaction.
        items:
          type: string
        type: array
      retention_days:
        description: |-
          RetentionDays drops runs older than this when the database opens. Nil
          keeps the default; an explicit 0 keeps everything.
        type: integer
      store_content:
        type: boolean
      tool_prices:
        additionalProperties:
          $ref: '#/definitions/config.ToolPriceConfig'
        type: object
    type: object
  config.ToolPriceConfig:
    properties:
      per_call:
        type: number
    type: object
  cron.Delivery:
    properties:
      channel:
        description: telegram, discord
        type: string
      mode:
        description: announce
        type: string
      to:
        description: chat_id
        type: string
    type: object
  cron.ExecutionResult:
    properties:
      result:
        type: string
      status:
        description: success, failed
        type: string
      ts:
        type: string
    type: object
  cron.Payload:
    properties:
      content:
        description: prompt
        type: string
      kind:
        description: agentTurn
        type: string
    type: object
  handler.AgentsResponse:
    properties:
      agents:
        items:
          $ref: '#/definitions/service.AgentInfo'
        type: array
    type: object
  handler.BuiltinToggleRequest:
    properties:
      enabled:
        example: true
        type: boolean
    type: object
  handler.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  handler.ChangeUsernameRequest:
    properties:
      new_username:
        type: string
      password:
        type: string
    type: object
  handler.ChannelRequest:
    properties:
      active:
        type: boolean
      mode:
        example: polling
        type: string
      ngrok_active:
        type: boolean
      ngrok_auth_token:
        type: string
      token:
        type: string
    type: object
  handler.ChatRequest:
    properties:
      conversation_id:
        example: conv-id or NEW
        type: string
      images:
        items:
          type: string
        type: array
      text:
        example: Check my workspace
        type: string
      user_id:
        example: 0
        type: integer
    type: object
  handler.ChatResponse:
    properties:
      conversation_id:
        type: string
      text:
        type: string
      timeline:
        items:
          $ref: '#/definitions/api.TimelineItem'
        type: array
      usage:
        $ref: '#/definitions/handler.UsageResponse'
    type: object
  handler.ContactsResponse:
    properties:
      contacts:
        items:
          $ref: '#/definitions/service.ContactView'
        type: array
    type: object
  handler.ContextFilesResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/service.ContextFile'
        type: array
    type: object
  handler.CreateContactRequest:
    properties:
      description:
        example: Research agent
        type: string
      name:
        example: research
        type: string
      token:
        type: string
      url:
        example: https://other-host/a2a
        type: string
    type: object
  handler.CreateCustomToolRequest:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        example: node
        type: string
      enabled:
        example: true
        type: boolean
      name:
        example: hello_helper
        type: string
      schema:
        items:
          type: integer
        type: array
    type: object
  handler.CreateMCPRequest:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        example: npx
        type: string
      enabled:
        example: true
        type: boolean
      env:
        additionalProperties:
          type: string
        type: object
      name:
        example: playwright
        type: string
    type: object
  handler.CreateProviderRequest:
    properties:
      api_key:
        type: string
      base_url:
        example: https://api.openai.com
        type: string
      default_model:
        example: gpt-4o
        type: string
      name:
        example: openai
        type: string
      type:
        example: openai
        type: string
    type: object
  handler.CronHistoryResponse:
    properties:
      history:
        items:
          $ref: '#/definitions/cron.ExecutionResult'
        type: array
    type: object
  handler.CronJobResponse:
    properties:
      agent_id:
        type: string
      created_at:
        type: string
      delivery:
        $ref: '#/definitions/cron.Delivery'
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      payload:
        $ref: '#/definitions/cron.Payload'
      schedule:
        $ref: '#/definitions/myaaw_internal_cron.Schedule'
      updated_at:
        type: string
    type: object
  handler.CronJobsResponse:
    properties:
      jobs:
        items:
          $ref: '#/definitions/myaaw_internal_cron.Job'
        type: array
    type: object
  handler.FileListResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/service.FileEntry'
        type: array
      path:
        type: string
    type: object
  handler.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  handler.LoginOKResponse:
    properties:
      ok:
        example: true
        type: boolean
      username:
        example: myaaw
        type: string
    type: object
  handler.LoginRequest:
    properties:
      password:
        example: myaawadmin
        type: string
      username:
        example: myaaw
        type: string
    type: object
  handler.LoginResponse:
    properties:
      expires_at:
        example: "2026-10-20T20:00:00Z"
        type: string
      token:
        example: a1b2c3
        type: string
      user_id:
        example: 0
        type: integer
    type: object
  handler.LogsResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/service.LogFile'
        type: array
    type: object
  handler.MkdirRequest:
    properties:
      path:
        example: /home/notes
        type: string
    type: object
  handler.OKResponse:
    properties:
      ok:
        example: true
        type: boolean
    type: object
  handler.PatchCustomToolRequest:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      enabled:
        type: boolean
      schema:
        items:
          type: integer
        type: array
    type: object
  handler.PatchMCPRequest:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      enabled:
        type: boolean
      env:
        additionalProperties:
          type: string
        type: object
    type: object
  handler.RenameConversationRequest:
    properties:
      title:
        example: Workspace cleanup
        type: string
    type: object
  handler.RenameConversationResponse:
    properties:
      id:
        type: string
      ok:
        example: true
        type: boolean
      title:
        type: string
    type: object
  handler.RenameRequest:
    properties:
      from:
        example: /home/AGENTS.md
        type: string
      to:
        example: /home/AGENTS.old.md
        type: string
    type: object
  handler.SearchResponse:
    properties:
      matches:
        items:
          $ref: '#/definitions/service.SearchMatch'
        type: array
    type: object
  handler.SetDefaultProviderRequest:
    properties:
      name:
        example: openai
        type: string
    type: object
  handler.SkillToggleRequest:
    properties:
      enabled:
        example: true
        type: boolean
    type: object
  handler.SkillToggleResponse:
    properties:
      enabled:
        type: boolean
      name:
        type: string
      ok:
        example: true
        type: boolean
    type: object
  handler.SkillsResponse:
    properties:
      skills:
        items:
          $ref: '#/definitions/skills.Skill'
        type: array
    type: object
  handler.UpdateProviderRequest:
    properties:
      api_key:
        type: string
      base_url:
        type: string
      default_model:
        type: string
      type:
        type: string
    type: object
  handler.UsageResponse:
    properties:
      completion_tokens:
        type: integer
      prompt_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
  handler.UsernameResponse:
    properties:
      user_id:
        example: 0
        type: integer
      username:
        example: myaaw
        type: string
    type: object
  handler.WriteContextRequest:
    properties:
      content:
        example: '# Daily rules'
        type: string
      path:
        example: memory/RULES.md
        type: string
    type: object
  handler.WriteFileRequest:
    properties:
      content:
        example: '# Instructions'
        type: string
      path:
        example: /home/AGENTS.md
        type: string
    type: object
  handler.terminalSizeRequest:
    properties:
      cols:
        type: integer
      rows:
        type: integer
    type: object
  myaaw_internal_cron.Job:
    properties:
      agent_id:
        type: string
      created_at:
        type: string
      delivery:
        $ref: '#/definitions/cron.Delivery'
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      payload:
        $ref: '#/definitions/cron.Payload'
      schedule:
        $ref: '#/definitions/myaaw_internal_cron.Schedule'
      updated_at:
        type: string
    type: object
  myaaw_internal_cron.Schedule:
    properties:
      expr:
        description: '* * * * * or 30m'
        type: string
      kind:
        description: cron, every, at
        type: string
      tz:
        description: Asia/Jakarta
        type: string
    type: object
  obs.ModelStat:
    properties:
      cache_hit_tokens:
        type: integer
      calls:
        type: integer
      cost_usd:
        type: number
      input_tokens:
        type: integer
      model:
        type: string
      output_tokens:
        type: integer
      priced:
        description: |-
          Priced is false when at least one call spent tokens without recording a
          cost — usually a missing price entry, sometimes a call recorded before the
          entry existed.
        type: boolean
      unpriced_calls:
        type: integer
    type: object
  obs.Run:
    properties:
      agent:
        type: string
      cache_hit_tokens:
        type: integer
      channel:
        type: string
      conversation_id:
        type: string
      ended_at:
        type: integer
      error:
        type: string
      first_token_ms:
        type: integer
      id:
        type: string
      input_tokens:
        type: integer
      model:
        type: string
      model_cost_usd:
        type: number
      output_tokens:
        type: integer
      parent_run_id:
        description: |-
          ParentRunID and ParentSpanID link a nested run (a subagent) into the
          trace that started it.
        type: string
      parent_span_id:
        type: string
      provider:
        type: string
      started_at:
        type: integer
      status:
        $ref: '#/definitions/obs.Status'
      tool_cost_usd:
        description: |-
          ToolCostUSD is what the tool calls of this run cost at the configured
          per-call prices. It is kept apart from ModelCostUSD on purpose.
        type: number
      total_ms:
        type: integer
      trigger:
        description: |-
          Trigger says what started the run: a user message ("user"), a cron job
          ("cron"), or a subagent ("subagent"). Heartbeats are not recorded.
        type: string
      user_id:
        type: string
    type: object
  obs.Session:
    properties:
      channel:
        type: string
      conversation_id:
        type: string
      cost_complete:
        description: CostComplete is false when a turn in the session used an unpriced
          model.
        type: boolean
      cost_usd:
        type: number
      error_count:
        type: integer
      input_tokens:
        type: integer
      last_active_at:
        type: integer
      output_tokens:
        type: integer
      started_at:
        type: integer
      turns:
        type: integer
      unpriced_turns:
        type: integer
    type: object
  obs.Span:
    properties:
      cache_hit_tokens:
        type: integer
      cost_usd:
        type: number
      duration_ms:
        type: integer
      ended_at:
        type: integer
      error:
        type: string
      first_token_ms:
        type: integer
      generation_ms:
        type: integer
      id:
        type: string
      input_json:
        type: string
      input_tokens:
        type: integer
      kind:
        $ref: '#/definitions/obs.SpanKind'
      name:
        type: string
      output_json:
        type: string
      output_tokens:
        type: integer
      parent_id:
        type: string
      request_index:
        type: integer
      run_id:
        type: string
      started_at:
        type: integer
      status:
        $ref: '#/definitions/obs.Status'
      step_index:
        type: integer
    type: object
  obs.SpanKind:
    enum:
    - run
    - user
    - system
    - compaction
    - step
    - llm
    - tool
    type: string
    x-enum-varnames:
    - KindRun
    - KindUser
    - KindSystem
    - KindCompaction
    - KindStep
    - KindLLM
    - KindTool
  obs.Status:
    enum:
    - running
    - completed
    - error
    - cancelled
    - truncated
    - max_iterations
    - interrupted
    - retried
    type: string
    x-enum-varnames:
    - StatusRunning
    - StatusCompleted
    - StatusError
    - StatusCancelled
    - StatusTruncated
    - StatusMaxIters
    - StatusInterrupted
    - StatusRetried
  obs.StepStat:
    properties:
      avg_ms:
        type: integer
      cost_usd:
        type: number
      count:
        type: integer
      p95_ms:
        type: integer
      step_index:
        type: integer
    type: object
  obs.Summary:
    properties:
      by_model:
        items:
          $ref: '#/definitions/obs.ModelStat'
        type: array
      by_trigger:
        items:
          $ref: '#/definitions/obs.TriggerStat'
        type: array
      cache_hit_tokens:
        type: integer
      cost_complete:
        description: |-
          CostComplete is false when at least one run used a model with no price,
          so CostUSD is a lower bound rather than the full spend.
        type: boolean
      cost_usd:
        type: number
      database_bytes:
        description: |-
          DatabaseBytes is the size of the trace database on disk, including its
          write-ahead log. It makes growth visible without shelling out to du.
        type: integer
      duration_ms_p50:
        type: integer
      duration_ms_p95:
        type: integer
      error_rate:
        type: number
      errors:
        type: integer
      first_token_ms_p50:
        type: integer
      from:
        type: integer
      input_tokens:
        type: integer
      most_expensive_run_id:
        type: string
      output_tokens:
        type: integer
      per_step:
        items:
          $ref: '#/definitions/obs.StepStat'
        type: array
      per_tool:
        items:
          $ref: '#/definitions/obs.ToolStat'
        type: array
      runs:
        type: integer
      slowest_run_id:
        type: string
      to:
        type: integer
      tool_cost_usd:
        description: ToolCostUSD is spend on priced tool calls, separate from model
          tokens.
        type: number
      unpriced_input_tokens:
        type: integer
      unpriced_models:
        items:
          type: string
        type: array
      unpriced_output_tokens:
        type: integer
      unpriced_runs:
        type: integer
    type: object
  obs.ToolStat:
    properties:
      avg_ms:
        type: integer
      calls:
        type: integer
      cost_usd:
        type: number
      errors:
        type: integer
      name:
        type: string
    type: object
  obs.TriggerStat:
    properties:
      cost_usd:
        type: number
      errors:
        type: integer
      input_tokens:
        type: integer
      output_tokens:
        type: integer
      runs:
        type: integer
      tool_cost_usd:
        type: number
      trigger:
        type: string
    type: object
  provider.FunctionCall:
    properties:
      arguments: {}
      name:
        type: string
      thought_signature:
        type: string
    type: object
  provider.Message:
    properties:
      action:
        type: string
      action_input:
        type: string
      content: {}
      duration_ms:
        type: integer
      error_message:
        type: string
      images:
        items:
          type: string
        type: array
      is_error:
        description: Transcript metadata (agent loop v2)
        type: boolean
      name:
        type: string
      observation:
        type: string
      role:
        type: string
      stop_reason:
        $ref: '#/definitions/provider.StopReason'
      thought:
        description: ReAct Trace Fields (UI metadata; not sent to providers)
        type: string
      tool_call_id:
        type: string
      tool_calls:
        items:
          $ref: '#/definitions/provider.ToolCall'
        type: array
      trace:
        description: Trace stores all ReAct steps as JSON array for final response
        items:
          $ref: '#/definitions/provider.ReactStep'
        type: array
      usage:
        allOf:
        - $ref: '#/definitions/provider.Usage'
        description: Token Usage
      v:
        type: integer
    type: object
  provider.ReactStep:
    properties:
      action:
        type: string
      action_input:
        type: string
      observation:
        type: string
      step_group:
        type: integer
      thought:
        type: string
      thought_signature:
        type: string
    type: object
  provider.StopReason:
    enum:
    - normal
    - max_iterations
    - length
    - error
    - aborted
    type: string
    x-enum-varnames:
    - StopNormal
    - StopMaxIterations
    - StopLength
    - StopError
    - StopAborted
  provider.ToolCall:
    properties:
      function:
        $ref: '#/definitions/provider.FunctionCall'
      id:
        type: string
      index:
        type: integer
      type:
        type: string
    type: object
  provider.Usage:
    properties:
      cached_input_tokens:
        description: |-
          CachedInputTokens is the share of PromptTokens served from the provider
          prompt cache. Providers that do not report it leave it at zero.
        type: integer
      completion_tokens:
        type: integer
      details:
        items:
          $ref: '#/definitions/provider.UsageDetail'
        type: array
      prompt_tokens:
        type: integer
      thoughts_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
  provider.UsageDetail:
    properties:
      modality:
        type: string
      token_count:
        type: integer
    type: object
  service.ActivityDay:
    properties:
      count:
        example: 3
        type: integer
      date:
        example: "2026-10-02"
        type: string
    type: object
  service.AgentInfo:
    properties:
      base_url:
        type: string
      default:
        type: boolean
      name:
        type: string
      port:
        type: integer
      running:
        type: boolean
    type: object
  service.ApprovalsPatch:
    properties:
      allow:
        items:
          type: string
        type: array
      deny:
        items:
          type: string
        type: array
      mode:
        type: string
      subagents:
        type: string
      timeout_seconds:
        type: integer
      unattended:
        type: string
    type: object
  service.ApprovalsView:
    properties:
      config:
        $ref: '#/definitions/config.ApprovalsConfig'
      grants:
        items:
          $ref: '#/definitions/service.GrantView'
        type: array
    type: object
  service.BackupArchive:
    properties:
      agent:
        type: string
      created_at:
        type: string
      name:
        type: string
      size:
        type: integer
    type: object
  service.BackupCreated:
    properties:
      archives:
        items:
          $ref: '#/definitions/backup.Result'
        type: array
      dir:
        type: string
    type: object
  service.BackupList:
    properties:
      archives:
        items:
          $ref: '#/definitions/service.BackupArchive'
        type: array
      dir:
        type: string
    type: object
  service.BackupRequest:
    properties:
      agents:
        description: Agents is empty to back up every initialized agent.
        items:
          type: string
        type: array
      include_caches:
        type: boolean
      include_logs:
        type: boolean
      include_venv:
        type: boolean
      include_workspace:
        type: boolean
      no_secrets:
        type: boolean
    type: object
  service.BotPatch:
    properties:
      blocked_tools:
        items:
          type: string
        type: array
      computer_use:
        $ref: '#/definitions/service.ComputerUsePatch'
      context_max_tokens:
        type: integer
