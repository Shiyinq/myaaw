basePath: /
definitions:
  api.TimelineItem:
    properties:
      arguments:
        type: string
      id:
        type: string
      is_error:
        type: boolean
      kind:
        type: string
      name:
        type: string
      result:
        type: string
      text:
        type: string
    type: object
  common.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  config.CronConfig:
    properties:
      active:
        type: boolean
    type: object
  config.GlobalBotConfig:
    properties:
      blocked_tools:
        items:
          type: string
        type: array
      context_max_tokens:
        type: integer
      max_iterations:
        type: integer
      max_tool_output_bytes:
        type: integer
      owner_ids:
        items:
          type: string
        type: array
      repeat_tool_call_limit:
        type: integer
      request_retries:
        type: integer
      run_timeout_seconds:
        type: integer
      stream:
        type: boolean
      stream_timeout_seconds:
        type: integer
      tool_timeout_seconds:
        type: integer
      type:
        type: string
      warning_iterations:
        type: integer
      watermark:
        type: boolean
    type: object
  config.HeartbeatConfig:
    properties:
      active:
        type: boolean
      channel:
        type: string
      every:
        type: string
      to:
        type: string
    type: object
  cron.Delivery:
    properties:
      channel:
        description: telegram, discord
        type: string
      mode:
        description: announce
        type: string
      to:
        description: chat_id
        type: string
    type: object
  cron.ExecutionResult:
    properties:
      result:
        type: string
      status:
        description: success, failed
        type: string
      ts:
        type: string
    type: object
  cron.Payload:
    properties:
      content:
        description: prompt
        type: string
      kind:
        description: agentTurn
        type: string
    type: object
  handler.AgentsResponse:
    properties:
      agents:
        items:
          $ref: '#/definitions/service.AgentInfo'
        type: array
    type: object
  handler.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  handler.ChangeUsernameRequest:
    properties:
      new_username:
        type: string
      password:
        type: string
    type: object
  handler.ChannelRequest:
    properties:
      active:
        type: boolean
      mode:
        example: polling
        type: string
      ngrok_active:
        type: boolean
      ngrok_auth_token:
        type: string
      token:
        type: string
    type: object
  handler.ChatRequest:
    properties:
      images:
        items:
          type: string
        type: array
      text:
        example: Check my workspace
        type: string
      user_id:
        example: 12345
        type: integer
    type: object
  handler.ChatResponse:
    properties:
      text:
        type: string
      timeline:
        items:
          $ref: '#/definitions/api.TimelineItem'
        type: array
      usage:
        $ref: '#/definitions/handler.UsageResponse'
    type: object
  handler.ConversationResponse:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      id:
        type: string
      messages:
        items:
          $ref: '#/definitions/provider.Message'
        type: array
      title:
        type: string
      updated_at:
        type: string
      userId:
        type: integer
    type: object
  handler.ConversationsResponse:
    properties:
      conversations:
        items:
          $ref: '#/definitions/service.ConversationSummary'
        type: array
    type: object
  handler.CreateAgentRequest:
    properties:
      name:
        example: myfriend
        type: string
    type: object
  handler.CreateProviderRequest:
    properties:
      api_key:
        type: string
      base_url:
        example: https://api.openai.com
        type: string
      default_model:
        example: gpt-4o
        type: string
      name:
        example: openai
        type: string
      type:
        example: openai
        type: string
    type: object
  handler.CronHistoryResponse:
    properties:
      history:
        items:
          $ref: '#/definitions/cron.ExecutionResult'
        type: array
    type: object
  handler.CronJobResponse:
    properties:
      agent_id:
        type: string
      created_at:
        type: string
      delivery:
        $ref: '#/definitions/cron.Delivery'
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      payload:
        $ref: '#/definitions/cron.Payload'
      schedule:
        $ref: '#/definitions/myaaw_internal_cron.Schedule'
      updated_at:
        type: string
    type: object
  handler.CronJobsResponse:
    properties:
      jobs:
        items:
          $ref: '#/definitions/myaaw_internal_cron.Job'
        type: array
    type: object
  handler.FileListResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/service.FileEntry'
        type: array
      path:
        type: string
    type: object
  handler.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  handler.LoginOKResponse:
    properties:
      ok:
        example: true
        type: boolean
      username:
        example: myaaw
        type: string
    type: object
  handler.LoginRequest:
    properties:
      password:
        example: myaawadmin
        type: string
      username:
        example: myaaw
        type: string
    type: object
  handler.LoginResponse:
    properties:
      expires_at:
        example: "2026-10-20T20:00:00Z"
        type: string
      token:
        example: a1b2c3
        type: string
    type: object
  handler.LogsResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/service.LogFile'
        type: array
    type: object
  handler.MkdirRequest:
    properties:
      path:
        example: /home/notes
        type: string
    type: object
  handler.OKResponse:
    properties:
      ok:
        example: true
        type: boolean
    type: object
  handler.RenameRequest:
    properties:
      from:
        example: /home/AGENTS.md
        type: string
      to:
        example: /home/AGENTS.old.md
        type: string
    type: object
  handler.SearchResponse:
    properties:
      matches:
        items:
          $ref: '#/definitions/service.SearchMatch'
        type: array
    type: object
  handler.SetDefaultProviderRequest:
    properties:
      name:
        example: openai
        type: string
    type: object
  handler.UpdateProviderRequest:
    properties:
      api_key:
        type: string
      base_url:
        type: string
      default_model:
        type: string
      type:
        type: string
    type: object
  handler.UsageResponse:
    properties:
      completion_tokens:
        type: integer
      prompt_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
  handler.UsernameResponse:
    properties:
      username:
        example: myaaw
        type: string
    type: object
  handler.WriteFileRequest:
    properties:
      content:
        example: '# Instructions'
        type: string
      path:
        example: /home/AGENTS.md
        type: string
    type: object
  myaaw_internal_cron.Job:
    properties:
      agent_id:
        type: string
      created_at:
        type: string
      delivery:
        $ref: '#/definitions/cron.Delivery'
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      payload:
        $ref: '#/definitions/cron.Payload'
      schedule:
        $ref: '#/definitions/myaaw_internal_cron.Schedule'
      updated_at:
        type: string
    type: object
  myaaw_internal_cron.Schedule:
    properties:
      expr:
        description: '* * * * * or 30m'
        type: string
      kind:
        description: cron, every, at
        type: string
      tz:
        description: Asia/Jakarta
        type: string
    type: object
  provider.FunctionCall:
    properties:
      arguments: {}
      name:
        type: string
      thought_signature:
        type: string
    type: object
  provider.Message:
    properties:
      action:
        type: string
      action_input:
        type: string
      content: {}
      duration_ms:
        type: integer
      error_message:
        type: string
      images:
        items:
          type: string
        type: array
      is_error:
        description: Transcript metadata (agent loop v2)
        type: boolean
      name:
        type: string
      observation:
        type: string
      role:
        type: string
      stop_reason:
        $ref: '#/definitions/provider.StopReason'
      thought:
        description: ReAct Trace Fields (UI metadata; not sent to providers)
        type: string
      tool_call_id:
        type: string
      tool_calls:
        items:
          $ref: '#/definitions/provider.ToolCall'
        type: array
      trace:
        description: Trace stores all ReAct steps as JSON array for final response
        items:
          $ref: '#/definitions/provider.ReactStep'
        type: array
      usage:
        allOf:
        - $ref: '#/definitions/provider.Usage'
        description: Token Usage
      v:
        type: integer
    type: object
  provider.ReactStep:
    properties:
      action:
        type: string
      action_input:
        type: string
      observation:
        type: string
      step_group:
        type: integer
      thought:
        type: string
      thought_signature:
        type: string
    type: object
  provider.StopReason:
    enum:
    - normal
    - max_iterations
    - length
    - error
    - aborted
    type: string
    x-enum-varnames:
    - StopNormal
    - StopMaxIterations
    - StopLength
    - StopError
    - StopAborted
  provider.ToolCall:
    properties:
      function:
        $ref: '#/definitions/provider.FunctionCall'
      id:
        type: string
      index:
        type: integer
      type:
        type: string
    type: object
  provider.Usage:
    properties:
      completion_tokens:
        type: integer
      details:
        items:
          $ref: '#/definitions/provider.UsageDetail'
        type: array
      prompt_tokens:
        type: integer
      thoughts_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
  provider.UsageDetail:
    properties:
      modality:
        type: string
      token_count:
        type: integer
    type: object
  service.AgentInfo:
    properties:
      base_url:
        type: string
      default:
        type: boolean
      name:
        type: string
      port:
        type: integer
      running:
        type: boolean
    type: object
  service.ChannelView:
    properties:
      active:
        type: boolean
      mode:
        type: string
      name:
        type: string
      ngrok_active:
        type: boolean
      ngrok_auth_token:
        $ref: '#/definitions/service.SecretState'
      token:
        $ref: '#/definitions/service.SecretState'
    type: object
  service.ChannelsView:
    properties:
      channels:
        items:
          $ref: '#/definitions/service.ChannelView'
        type: array
    type: object
  service.ConfigView:
    properties:
      bot:
        $ref: '#/definitions/config.GlobalBotConfig'
      channels:
        items:
          $ref: '#/definitions/service.ChannelView'
        type: array
      cron:
        $ref: '#/definitions/config.CronConfig'
      default_provider:
        type: string
      heartbeat:
        $ref: '#/definitions/config.HeartbeatConfig'
      providers:
        items:
          $ref: '#/definitions/service.ProviderView'
        type: array
      synthesizer:
        $ref: '#/definitions/service.ServiceSecretView'
      transcriber:
        $ref: '#/definitions/service.ServiceSecretView'
    type: object
  service.ConversationSummary:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      id:
        type: string
      message_count:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  service.CronJobInput:
    properties:
      channel:
        type: string
      enabled:
        type: boolean
      expr:
        type: string
      message:
        type: string
      name:
        type: string
      schedule_kind:
        description: cron, every, at
        type: string
      to:
        type: string
      tz:
        type: string
    type: object
  service.FileContent:
    properties:
      content:
        type: string
      mod_time:
        type: string
      path:
        type: string
      size:
        type: integer
    type: object
  service.FileEntry:
    properties:
      is_dir:
        type: boolean
      mod_time:
        type: string
      name:
        type: string
      path:
        type: string
      size:
        type: integer
    type: object
  service.LogFile:
    properties:
      mod_time:
        type: string
      name:
        type: string
      size:
        type: integer
    type: object
  service.ProviderView:
    properties:
      api_key:
        $ref: '#/definitions/service.SecretState'
      base_url:
        type: string
      default_model:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  service.ProvidersView:
    properties:
      default_provider:
        type: string
      providers:
        items:
          $ref: '#/definitions/service.ProviderView'
        type: array
    type: object
  service.SearchMatch:
    properties:
      line:
        type: integer
      path:
        type: string
      text:
        type: string
    type: object
  service.SecretState:
    properties:
      configured:
        type: boolean
      masked:
        type: string
    type: object
  service.ServerStatus:
    properties:
      base_url:
        type: string
      pid:
        type: integer
      port:
        type: integer
      running:
        type: boolean
    type: object
  service.ServiceSecretView:
    properties:
      api_key:
        $ref: '#/definitions/service.SecretState'
      provider:
        type: string
    type: object
host: localhost:9000
info:
  contact: {}
  description: Unified API for agents, chat, logs, and files. Authenticate with POST
    /auth/login, then send the token in the Authorization header.
  title: Myaaw Control Plane API
  version: 0.1.0
paths:
  /agents:
    get:
      description: Returns every initialized agent with its default flag, running
        state, port, and base URL.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AgentsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List agents
      tags:
      - Agents
    post:
      consumes:
      - application/json
      parameters:
      - description: Agent name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/service.AgentInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create agent
      tags:
      - Agents
  /agents/{name}:
    delete:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete agent
      tags:
      - Agents
    get:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.AgentInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get agent
      tags:
      - Agents
  /agents/{name}/channels:
    get:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ChannelsView'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List channels
      tags:
      - Channels
  /agents/{name}/channels/{channel}:
    delete:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: telegram or discord
        in: path
        name: channel
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Disable channel
      tags:
      - Channels
    put:
      consumes:
      - application/json
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: telegram or discord
        in: path
        name: channel
        required: true
        type: string
      - description: Channel settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChannelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ChannelView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create or update channel
      tags:
      - Channels
  /agents/{name}/chat:
    post:
      consumes:
      - application/json
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Chat request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ChatResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Chat with an agent
      tags:
      - Chat
  /agents/{name}/chat/stream:
    post:
      consumes:
      - application/json
      description: Relays the agent's Server-Sent Events (thought, chunk, tool, tool_result,
        done, error).
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Chat request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChatRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stream chat with an agent
      tags:
      - Chat
  /agents/{name}/config:
    get:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ConfigView'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get agent config
      tags:
      - Config
  /agents/{name}/conversations:
    get:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      - description: Maximum results (default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ConversationsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List conversations
      tags:
      - Conversations
  /agents/{name}/conversations/{id}:
    get:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ConversationResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get conversation
      tags:
      - Conversations
  /agents/{name}/cron:
    get:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CronJobsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List cron jobs
      tags:
      - Cron
    post:
