  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Health check
      tags:
      - System
  /providers/models:
    post:
      consumes:
      - application/json
      parameters:
      - description: Provider credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.ModelLookupInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ModelListView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List models for a provider
      tags:
      - Providers
securityDefinitions:
  BearerAuth:
    description: Token returned by POST /auth/login. Paste it with or without the
      "Bearer " prefix.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
