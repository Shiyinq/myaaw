basePath: /
definitions:
  api.TimelineItem:
    properties:
      arguments:
        type: string
      id:
        type: string
      is_error:
        type: boolean
      kind:
        type: string
      name:
        type: string
      result:
        type: string
      text:
        type: string
    type: object
  common.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  handler.AgentsResponse:
    properties:
      agents:
        items:
          $ref: '#/definitions/service.AgentInfo'
        type: array
    type: object
  handler.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  handler.ChangeUsernameRequest:
    properties:
      new_username:
        type: string
      password:
        type: string
    type: object
  handler.ChatRequest:
    properties:
      images:
        items:
          type: string
        type: array
      text:
        example: Check my workspace
        type: string
      user_id:
        example: 12345
        type: integer
    type: object
  handler.ChatResponse:
    properties:
      text:
        type: string
      timeline:
        items:
          $ref: '#/definitions/api.TimelineItem'
        type: array
      usage:
        $ref: '#/definitions/handler.UsageResponse'
    type: object
  handler.FileListResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/service.FileEntry'
        type: array
      path:
        type: string
    type: object
  handler.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  handler.LoginOKResponse:
    properties:
      ok:
        example: true
        type: boolean
      username:
        example: myaaw
        type: string
    type: object
  handler.LoginRequest:
    properties:
      password:
        example: myaawadmin
        type: string
      username:
        example: myaaw
        type: string
    type: object
  handler.LoginResponse:
    properties:
      expires_at:
        example: "2026-10-20T20:00:00Z"
        type: string
      token:
        example: a1b2c3
        type: string
    type: object
  handler.MkdirRequest:
    properties:
      path:
        example: /home/notes
        type: string
    type: object
  handler.OKResponse:
    properties:
      ok:
        example: true
        type: boolean
    type: object
  handler.RenameRequest:
    properties:
      from:
        example: /home/AGENTS.md
        type: string
      to:
        example: /home/AGENTS.old.md
        type: string
    type: object
  handler.SearchResponse:
    properties:
      matches:
        items:
          $ref: '#/definitions/service.SearchMatch'
        type: array
    type: object
  handler.UsageResponse:
    properties:
      completion_tokens:
        type: integer
      prompt_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
  handler.UsernameResponse:
    properties:
      username:
        example: myaaw
        type: string
    type: object
  handler.WriteFileRequest:
    properties:
      content:
        example: '# Instructions'
        type: string
      path:
        example: /home/AGENTS.md
        type: string
    type: object
  service.AgentInfo:
    properties:
      base_url:
        type: string
      default:
        type: boolean
      name:
        type: string
      port:
        type: integer
      running:
        type: boolean
    type: object
  service.FileContent:
    properties:
      content:
        type: string
      mod_time:
        type: string
      path:
        type: string
      size:
        type: integer
    type: object
  service.FileEntry:
    properties:
      is_dir:
        type: boolean
      mod_time:
        type: string
      name:
        type: string
      path:
        type: string
      size:
        type: integer
    type: object
  service.SearchMatch:
    properties:
      line:
        type: integer
      path:
        type: string
      text:
        type: string
    type: object
host: localhost:9000
info:
  contact: {}
  description: Unified API for agents, chat, logs, and files. Authenticate with POST
    /auth/login, then send the token in the Authorization header.
  title: Myaaw Control Plane API
  version: 0.1.0
paths:
  /agents:
    get:
      description: Returns every initialized agent with its default flag, running
        state, port, and base URL.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AgentsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List agents
      tags:
      - Agents
  /agents/{name}:
    get:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.AgentInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get agent
      tags:
      - Agents
  /agents/{name}/chat:
    post:
      consumes:
      - application/json
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Chat request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ChatResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Chat with an agent
      tags:
      - Chat
  /agents/{name}/chat/stream:
    post:
      consumes:
      - application/json
      description: Relays the agent's Server-Sent Events (thought, chunk, tool, tool_result,
        done, error).
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Chat request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChatRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stream chat with an agent
      tags:
      - Chat
  /agents/{name}/fs:
    delete:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Virtual path
        in: query
        name: path
        required: true
        type: string
      - description: Delete directories recursively
        in: query
        name: recursive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an agent path
      tags:
      - Files
    get:
      description: Lists the virtual roots (/home, /skills, /jobs) or the entries
        of one directory.
      parameters:
      - default: default
        description: Agent name
        in: path
        name: name
        required: true
        type: string
      - default: /
        description: Virtual path
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.FileListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Browse agent files
      tags:
      - Files
  /agents/{name}/fs/mkdir:
    post:
      consumes:
      - application/json
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Directory path
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.MkdirRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an agent directory
      tags:
      - Files
  /agents/{name}/fs/read:
    get:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - default: /home/AGENTS.md
        description: Virtual path
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.FileContent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Read an agent file
      tags:
      - Files
  /agents/{name}/fs/rename:
    post:
      consumes:
      - application/json
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Source and destination
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RenameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rename or move an agent path
      tags:
      - Files
  /agents/{name}/fs/search:
    get:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Search text
        in: query
        name: q
        required: true
        type: string
      - default: /home
        description: Virtual path
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SearchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search agent files
      tags:
      - Files
  /agents/{name}/fs/write:
    post:
      consumes:
      - application/json
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Path and content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.WriteFileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.FileContent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Write an agent file
      tags:
      - Files
  /auth/change-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Passwords
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with username and password and receive a bearer token.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OKResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UsernameResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - Auth
  /auth/username:
    put:
      consumes:
      - application/json
      parameters:
      - description: Password and new username
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChangeUsernameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LoginOKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change username
      tags:
      - Auth
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Health check
      tags:
      - System
securityDefinitions:
  BearerAuth:
    description: Bearer token returned by POST /auth/login
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
