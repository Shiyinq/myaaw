host: localhost:9000
info:
  contact: {}
  description: Unified API for agents, chat, logs, and files. Authenticate with POST
    /auth/login, then send the token in the Authorization header.
  title: Myaaw Control Plane API
  version: 0.1.0
paths:
  /agents:
    get:
      description: Returns every initialized agent with its default flag, running
        state, port, and base URL.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AgentsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List agents
      tags:
      - Agents
    post:
      consumes:
      - application/json
      parameters:
      - description: Agent name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/service.AgentInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create agent
      tags:
      - Agents
  /agents/{name}:
    delete:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete agent
      tags:
      - Agents
    get:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.AgentInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get agent
      tags:
      - Agents
  /agents/{name}/channels:
    get:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ChannelsView'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List channels
      tags:
      - Channels
  /agents/{name}/channels/{channel}:
    delete:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: telegram or discord
        in: path
        name: channel
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
