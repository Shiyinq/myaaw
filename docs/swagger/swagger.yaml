basePath: /
definitions:
  api.ChatRequest:
    properties:
      conversation_id:
        type: string
      images:
        items:
          type: string
        type: array
      text:
        type: string
      user_id:
        type: integer
    type: object
  api.TimelineItem:
    properties:
      arguments:
        type: string
      attempt:
        description: Retry and compaction details, set on their own kinds.
        type: integer
      dropped_messages:
        type: integer
      id:
        type: string
      is_error:
        type: boolean
      kind:
        type: string
      name:
        type: string
      result:
        type: string
      subagent:
        description: SubAgent names the sub-agent that raised an approval item, if
          any.
        type: string
      text:
        type: string
      tokens_after:
        type: integer
      tokens_before:
        type: integer
    type: object
  channel.QueueEnvelope:
    properties:
      channel:
        type: string
      payload:
        items:
          type: integer
        type: array
    type: object
  common.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  handler.HeartbeatRequest:
    properties:
      channel:
        type: string
      prompt:
        type: string
      to:
        type: string
      trigger:
        type: string
    type: object
  myaaw_internal_services_bot_handler.ChatResponse:
    properties:
      conversation_id:
        type: string
      run_id:
        type: string
      text:
        type: string
      timeline:
        items:
          $ref: '#/definitions/api.TimelineItem'
        type: array
      usage:
        $ref: '#/definitions/myaaw_internal_services_bot_handler.UsageResponse'
    type: object
  myaaw_internal_services_bot_handler.UsageResponse:
    properties:
      completion_tokens:
        type: integer
      prompt_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Myaaw is an intelligent API Gateway with multi-channel support (Telegram,
    Discord, etc.).
  title: Myaaw API Gateway
  version: 0.0.1
paths:
  /api/approvals/{id}:
    post:
      consumes:
      - application/json
      description: Answers a pending approval request created by /api/chat or /api/chat/stream.
      parameters:
      - description: Approval ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Decision: allow_once | allow_session | allow_always | deny'
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Resolve a tool approval
      tags:
      - Chat
  /api/chat:
    post:
      consumes:
      - application/json
      description: Direct REST API chat endpoint (non-streaming)
      parameters:
      - description: Chat request; user_id is optional and defaults to 0
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/myaaw_internal_services_bot_handler.ChatResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: API Chat
      tags:
      - API
  /api/chat/stream:
    post:
      consumes:
      - application/json
      description: Direct REST API chat endpoint with Server-Sent Events streaming
      parameters:
      - description: Chat request; user_id is optional and defaults to 0
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ChatRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: API Chat Stream
      tags:
      - API
  /heartbeat:
    post:
      consumes:
      - application/json
      description: To process heartbeat request from consumer
      parameters:
      - description: Heartbeat request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.HeartbeatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Heartbeat
      tags:
      - Bot
  /webhook/bot:
    post:
      consumes:
      - application/json
      description: To receive incoming message from RabbitMQ consumer (channel-agnostic)
      parameters:
      - description: Queue envelope with channel and payload
        in: body
        name: envelope
        required: true
        schema:
          $ref: '#/definitions/channel.QueueEnvelope'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Webhook
      tags:
      - Bot
  /webhook/telegram:
    post:
      consumes:
      - application/json
      description: To receive incoming message from Telegram and push to Queue
      parameters:
      - description: Telegram incoming chat
        in: body
        name: book
        required: true
        schema: {}
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Queue
      tags:
      - Bot
swagger: "2.0"
