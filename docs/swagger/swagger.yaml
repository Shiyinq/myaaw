basePath: /
definitions:
  api.ChatRequest:
    properties:
      images:
        items:
          type: string
        type: array
      text:
        type: string
      user_id:
        type: integer
    type: object
  channel.QueueEnvelope:
    type: object
  common.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  handler.ChatResponse:
    properties:
      text:
        type: string
      trace:
        items:
          $ref: '#/definitions/handler.TraceStep'
        type: array
      usage:
        $ref: '#/definitions/handler.UsageResponse'
    type: object
  handler.HeartbeatRequest:
    properties:
      channel:
        type: string
      prompt:
        type: string
      to:
        type: string
      trigger:
        type: string
    type: object
  handler.TraceStep:
    properties:
      action:
        type: string
      observation:
        type: string
    type: object
  handler.UsageResponse:
    properties:
      completion_tokens:
        type: integer
      prompt_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Myaaw is an intelligent API Gateway with multi-channel support (Telegram,
    Discord, etc.).
  title: Myaaw API Gateway
  version: 0.0.1
paths:
  /api/chat:
    post:
      consumes:
      - application/json
      description: Direct REST API chat endpoint (non-streaming)
      parameters:
      - description: Chat request with user_id and text
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ChatResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: API Chat
      tags:
      - API
  /api/chat/stream:
    post:
      consumes:
      - application/json
      description: Direct REST API chat endpoint with Server-Sent Events streaming
      parameters:
      - description: Chat request with user_id and text
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ChatRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: API Chat Stream
      tags:
      - API
  /heartbeat:
    post:
      consumes:
      - application/json
      description: To process heartbeat request from consumer
      parameters:
      - description: Heartbeat request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.HeartbeatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Heartbeat
      tags:
      - Bot
  /webhook/bot:
    post:
      consumes:
      - application/json
      description: To receive incoming message from RabbitMQ consumer (channel-agnostic)
      parameters:
      - description: Queue envelope with channel and payload
        in: body
        name: envelope
        required: true
        schema:
          $ref: '#/definitions/channel.QueueEnvelope'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Webhook
      tags:
      - Bot
  /webhook/telegram:
    post:
      consumes:
      - application/json
      description: To receive incoming message from Telegram and push to Queue
      parameters:
      - description: Telegram incoming chat
        in: body
        name: book
        required: true
        schema: {}
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Queue
      tags:
      - Bot
swagger: "2.0"
