basePath: /
definitions:
  api.ChatRequest:
    properties:
      conversation_id:
        type: string
      files:
        items:
          $ref: '#/definitions/channel.FileUpload'
        type: array
      images:
        items:
          type: string
        type: array
      request_id:
        description: RequestID lets the client stop this run with POST /api/chat/stop.
        type: string
      rewind_user_offset:
        description: |-
          RewindUserOffset rewinds the transcript before this turn. 0 keeps the
          transcript up to the last user message (regenerate); N keeps it up to the
          user message N turns earlier (edit that message with `text`).
        type: integer
      text:
        type: string
      user_id:
        type: integer
    type: object
  api.TimelineItem:
    properties:
      args:
        description: Args carries the full argument JSON of an approval item.
        type: string
      arguments:
        type: string
      attempt:
        description: Retry and compaction details, set on their own kinds.
        type: integer
      dropped_messages:
        type: integer
      id:
        type: string
      is_error:
        type: boolean
      kind:
        type: string
      name:
        type: string
      result:
        type: string
      subagent:
        description: SubAgent names the sub-agent that raised an approval item, if
          any.
        type: string
      text:
        type: string
      tokens_after:
        type: integer
      tokens_before:
        type: integer
    type: object
  channel.FileUpload:
    properties:
      data_base64:
        type: string
      mime_type:
        type: string
      name:
        type: string
    type: object
  channel.QueueEnvelope:
    properties:
      channel:
        type: string
      payload:
        items:
          type: integer
        type: array
    type: object
  common.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  handler.AttachmentResponse:
    properties:
      file_name:
        type: string
      kind:
        type: string
      mime_type:
        type: string
      path:
        type: string
      project_type:
        type: string
      size:
        type: integer
    type: object
  handler.ChatStopRequest:
    properties:
      request_id:
        type: string
    type: object
  handler.HeartbeatRequest:
    properties:
      channel:
        type: string
      chat_type:
        type: string
      prompt:
        type: string
      session_id:
        type: string
      thread_id:
        type: string
      to:
        type: string
      trigger:
        type: string
    type: object
  handler.RunInfo:
    properties:
      conversation_id:
        type: string
      finished_at:
        type: string
      request_id:
        type: string
      started_at:
        type: string
      streaming:
        type: boolean
    type: object
  myaaw_internal_services_bot_handler.ChatResponse:
    properties:
      attachments:
        items:
          $ref: '#/definitions/handler.AttachmentResponse'
        type: array
      conversation_id:
        type: string
      run_id:
        type: string
      text:
        type: string
      timeline:
        items:
          $ref: '#/definitions/api.TimelineItem'
        type: array
      usage:
        $ref: '#/definitions/myaaw_internal_services_bot_handler.UsageResponse'
    type: object
  myaaw_internal_services_bot_handler.UsageResponse:
    properties:
      completion_tokens:
        type: integer
      prompt_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Myaaw is an intelligent API Gateway with multi-channel support (Telegram,
    Discord, etc.).
  title: Myaaw API Gateway
  version: 0.0.1
paths:
  /api/approvals/{id}:
    post:
      consumes:
      - application/json
      description: Answers a pending approval request created by /api/chat or /api/chat/stream.
      parameters:
      - description: Approval ID
        in: path
        name: id
        required: true
        type: string
      - description: Owning user id (alternative to the body user_id)
        in: header
        name: X-Myaaw-User-ID
        type: string
      - description: 'Decision: allow_once | allow_session | allow_always | deny,
          plus the owning user_id'
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Resolve a tool approval
      tags:
      - Chat
  /api/chat:
    post:
      consumes:
      - application/json
      description: Direct REST API chat endpoint (non-streaming)
      parameters:
      - description: Chat request; user_id is optional and defaults to 0
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/myaaw_internal_services_bot_handler.ChatResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: API Chat
      tags:
      - API
  /api/chat/run/{id}/stream:
    get:
      description: Streams the events of a running (or recently finished) run, replaying
        everything after `after`. The run keeps going when this connection drops.
      parameters:
      - description: Request id of the run
        in: path
        name: id
        required: true
        type: string
      - default: 0
        description: Skip events before this index
        in: query
        name: after
        type: integer
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Attach to a run
      tags:
      - API
  /api/chat/runs:
    get:
      description: Lists the runs a client can attach to, newest first. Finished runs
        stay listed for a short while so a reconnecting tab can read their tail.
      parameters:
      - description: Only runs of this conversation
        in: query
        name: conversation_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/handler.RunInfo'
              type: array
            type: object
      summary: List runs
      tags:
      - API
  /api/chat/stop:
    post:
      consumes:
      - application/json
      description: Cancels the run started with the same request_id. Whatever the
        model produced is kept in the transcript, and the run stops spending provider
        tokens.
      parameters:
      - description: Request id of the run to stop
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChatStopRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Stop a running chat
      tags:
      - API
  /api/chat/stream:
    post:
      consumes:
      - application/json
      description: Direct REST API chat endpoint with Server-Sent Events streaming
      parameters:
      - description: Chat request; user_id is optional and defaults to 0
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ChatRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: API Chat Stream
      tags:
      - API
  /api/events:
    get:
      description: A `conversation.updated` event is emitted when a cron, heartbeat,
        or sub-agent turn lands. The payload names the conversation; read it for the
        transcript. A `HEARTBEAT_OK` turn is not stored, so it emits nothing.
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
      summary: Conversation events
      tags:
      - API
  /heartbeat:
    post:
      consumes:
      - application/json
      description: To process heartbeat request from consumer
      parameters:
      - description: Heartbeat request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.HeartbeatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Heartbeat
      tags:
      - Bot
  /webhook/bot:
    post:
      consumes:
      - application/json
      description: To receive incoming message from RabbitMQ consumer (channel-agnostic)
      parameters:
      - description: Queue envelope with channel and payload
        in: body
        name: envelope
        required: true
        schema:
          $ref: '#/definitions/channel.QueueEnvelope'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Webhook
      tags:
      - Bot
  /webhook/telegram:
    post:
      consumes:
      - application/json
      description: To receive incoming message from Telegram and push to Queue
      parameters:
      - description: Telegram incoming chat
        in: body
        name: book
        required: true
        schema: {}
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Queue
      tags:
      - Bot
swagger: "2.0"
