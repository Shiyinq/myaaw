name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Ensure this matches your project's Go version

      # Install C dependencies for Linux
      - name: Install Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libportaudio2 portaudio19-dev

      # Install C dependencies for macOS
      - name: Install Dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install portaudio

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        shell: bash
        run: |
          mkdir -p bin
          echo "Building for ${{ matrix.goos }}/${{ matrix.goarch }}..."
          go build -v -ldflags "-s -w -X main.Version=${{ github.ref_name }} -X main.Commit=${{ github.sha }} -X main.Date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -o bin/myaaw-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/myaaw

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myaaw-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/myaaw-*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*
          generate_release_notes: true
